root: true
parser: '@typescript-eslint/parser'
plugins:
  - '@typescript-eslint'
  - react
  - json
  - jsdoc

settings:
  react:
    version: '16.3'

extends:
  - prettier
  - prettier/react
  - plugin:@typescript-eslint/recommended
  - prettier/@typescript-eslint
  - plugin:github/react

rules:
  ##########
  # CUSTOM #
  ##########
  insecure-random: error
  react-no-unbound-dispatcher-props: error
  react-readonly-props-and-state: error
  react-proper-lifecycle-methods: error
  no-loosely-typed-webcontents-ipc: error

  ###########
  # PLUGINS #
  ###########

  # TYPESCRIPT
  '@typescript-eslint/naming-convention':
    - error
    - selector: interface
      format:
        - PascalCase
      custom:
        regex: '^I[A-Z]'
        match: true
    - selector: class
      format:
        - PascalCase
    - selector: variableLike
      format: null
      custom:
        regex: '^(any|Number|number|String|string|Boolean|boolean|Undefined|undefined)$'
        match: false
  '@typescript-eslint/consistent-type-assertions':
    - error
    - assertionStyle: 'as'
  '@typescript-eslint/no-unused-expressions': error
  '@typescript-eslint/explicit-member-accessibility': error
  '@typescript-eslint/no-unused-vars':
    - error
    - args: 'none'
  '@typescript-eslint/no-use-before-define':
    - error
    - functions: false
      variables: false
      typedefs: false
  '@typescript-eslint/member-ordering':
    - error
    - default:
        - static-field
        - static-method
        - field
        - abstract-method
        - constructor
        - method
  '@typescript-eslint/no-extraneous-class': error
  '@typescript-eslint/no-empty-interface': error
  '@typescript-eslint/no-non-null-assertion': off
  '@typescript-eslint/ban-types': off
  '@typescript-eslint/no-var-requires': off
  '@typescript-eslint/triple-slash-reference': off
  '@typescript-eslint/explicit-module-boundary-types': off
  '@typescript-eslint/no-explicit-any': off
  '@typescript-eslint/no-inferrable-types': off
  '@typescript-eslint/no-empty-function': off
  '@typescript-eslint/no-redeclare': error

  # React
  react/jsx-boolean-value:
    - error
    - always
  react/jsx-key: error
  react/jsx-no-bind: error
  react/no-string-refs: error
  react/jsx-uses-vars: error
  react/jsx-uses-react: error
  react/no-unused-state: error
  react/no-unused-prop-types: error
  react/prop-types:
    - error
    - ignore: ['children']

  # JSDoc
  jsdoc/check-alignment: error
  jsdoc/check-tag-names: error
  jsdoc/check-types: error
  jsdoc/implements-on-classes: error
  jsdoc/tag-lines:
    - error
    - any
    - startLines: 1
  jsdoc/no-undefined-types: error
  jsdoc/valid-types: error

  ###########
  # BUILTIN #
  ###########
  curly: error
  no-new-wrappers: error
  no-redeclare: off
  no-eval: error
  no-sync: error
  no-var: error
  prefer-const: error
  eqeqeq:
    - error
    - smart
  strict:
    - error
    - global
  no-buffer-constructor: error
  no-restricted-imports:
    - error
    - paths:
        - name: electron
          importNames: ['ipcRenderer']
          message:
            "Please use 'import * as ipcRenderer' from 'ipc-renderer' instead to
            get strongly typed IPC methods."
        - name: electron/renderer
          importNames: ['ipcRenderer']
          message:
            "Please use 'import * as ipcRenderer' from 'ipc-renderer' instead to
            get strongly typed IPC methods."
        - name: electron
          importNames: ['ipcMain']
          message:
            "Please use 'import * as ipcMain' from 'ipc-main' instead to get
            strongly typed IPC methods."
        - name: electron/main
          importNames: ['ipcMain']
          message:
            "Please use 'import * as ipcMain' from 'ipc-main' instead to get
            strongly typed IPC methods."

  ###########
  # SPECIAL #
  ###########
  no-restricted-syntax:
    - error
    - selector: ExportDefaultDeclaration
      message: Use of default exports is forbidden

overrides:
  - files: '*.d.ts'
    rules:
      strict:
        - error
        - never
  - files: 'app/test/**/*'
    rules:
      '@typescript-eslint/no-non-null-assertion': off
      react/jsx-no-bind: off
  - files: 'script/**/*'
    rules:
      '@typescript-eslint/no-non-null-assertion': off
  - files: 'app/src/ui/octicons/octicons.generated.ts'
    rules:
      '@typescript-eslint/naming-convention': off

parserOptions:
  sourceType: module
  ecmaFeatures:
    jsx: true
